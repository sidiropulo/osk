services:
  oskauth:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5037:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=postgres;Database=oskauth;Username=oskauth;Password=passwordstrong123"
    depends_on:
      - postgres
  postgres:
    image: postgres:17
    container_name: osk_postgresql
    environment:
      POSTGRES_DB: oskauth
      POSTGRES_USER: oskauth
      POSTGRES_PASSWORD: passwordstrong123
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  pgadmin:
    image: dpage/pgadmin4:9.8
    container_name: osk_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: secret
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - postgres
volumes:
  postgres-data:
  pgadmin-data:
